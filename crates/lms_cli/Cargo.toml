[package]
name = "lms_cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lms"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
env_logger = "0.11.10"
lms_core = { path = "../lms_core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
log = "0.4.29"
reqwest = { version = "0.13.2", features = ["json", "gzip", "brotli", "deflate", "cookies"] }
tokio = { version = "1.52.0", features = ["full"] }
scraper = "0.26.0"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
